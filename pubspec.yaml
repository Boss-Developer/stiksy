name: stiksy
description: "Stiksy: create and share WhatsApp sticker packs."
publish_to: 'none'

version: 1.0.1+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  shared_preferences: ^2.5.4
  permission_handler: ^12.0.1
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  google_mobile_ads: ^9.1.0
  image_picker: ^1.2.4
  supabase_flutter: ^2.18.0
  flutter_secure_storage: ^11.2.0
  crypto: ^3.0.7
  in_app_purchase: ^3.3.1
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:

  uses-material-design: true
  assets:
    - assets/stickers/
    - assets/fonts/OFL-NotoNastaliqUrdu.txt
    - assets/fonts/OFL-notonaskharabic.txt
    - assets/fonts/OFL-poppins.txt
    - assets/fonts/OFL-montserrat.txt
  fonts:
    - family: NotoNastaliqUrdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu.ttf
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic.ttf
          weight: 700
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon-master.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "assets/icon/background.png"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: "assets/icon/monochrome.png"
